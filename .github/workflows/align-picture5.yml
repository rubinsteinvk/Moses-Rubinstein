name: Align Moses Picture 5

on:
  push:
    paths:
      - '.github/workflows/align-picture5.yml'
      - 'data/picture5.json'
      - 'tools/align_picture5.py'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL for the source recording'
        required: true
        default: 'https://www.youtube.com/watch?v=LjPlpQznQqI'
      model:
        description: 'Whisper model size'
        required: true
        default: 'small'
        type: choice
        options: [small, medium, large-v3]

env:
  YOUTUBE_URL: ${{ inputs.youtube_url || 'https://www.youtube.com/watch?v=LjPlpQznQqI' }}
  MODEL_SIZE: ${{ inputs.model || 'small' }}

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install PyTorch CPU and alignment stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install whisperx yt-dlp
      - name: Download audio for analysis only
        run: yt-dlp -x --audio-format wav --audio-quality 0 -o 'source.%(ext)s' "$YOUTUBE_URL"
      - name: Run German ASR and word alignment
        run: python tools/align_picture5.py source.wav data/picture5.json data/picture5-timing.json
      - name: Upload alignment result
        uses: actions/upload-artifact@v4
        with:
          name: picture5-word-alignment
          path: data/picture5-timing.json
