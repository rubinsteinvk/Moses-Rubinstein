name: Align Moses Picture 5

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Google Drive sharing URL or direct URL to MP3/WAV'
        required: true
        default: ''
      model:
        description: 'Whisper model size for coarse German ASR anchors'
        required: true
        default: 'large-v3'
        type: choice
        options: [medium, large-v3]
  push:
    branches: [main]

env:
  AUDIO_URL: ${{ inputs.audio_url || 'https://drive.google.com/file/d/13TjCy78XBFHNND0EQwlsstGl4mMWqBYz/view?usp=drive_link' }}
  MODEL_SIZE: ${{ inputs.model || 'large-v3' }}

jobs:
  align:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[align-picture5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyTorch CPU and alignment stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install whisperx gdown

      - name: Download supplied audio from Google Drive or direct URL
        shell: bash
        run: |
          set -euo pipefail
          url="$AUDIO_URL"
          if [[ "$url" =~ drive\.google\.com/file/d/([^/]+)/view ]]; then
            file_id="${BASH_REMATCH[1]}"
            echo "Detected Google Drive file ID: $file_id"
            gdown "$file_id" -O source.input
          elif [[ "$url" =~ drive\.google\.com/open\?id=([^&]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
            echo "Detected Google Drive file ID: $file_id"
            gdown "$file_id" -O source.input
          else
            echo "Using supplied direct audio URL"
            curl -L --fail --retry 3 --output source.input "$url"
          fi
          test -s source.input
          file source.input

      - name: Convert supplied audio to WAV
        run: ffmpeg -y -i source.input -ar 16000 -ac 1 source.wav

      - name: Run anchor-constrained phrase alignment
        run: python tools/align_picture5.py source.wav data/picture5.json data/picture5-anchors.json data/picture5-timing.json "$MODEL_SIZE"

      - name: Upload alignment result
        uses: actions/upload-artifact@v4
        with:
          name: picture5-word-alignment
          path: data/picture5-timing.json
          retention-days: 7

# This pass aligns only the 101 sung words supplied for Picture 5; the following chorus text is excluded.
